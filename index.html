</style></head><body><div id="app"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updatePassword} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,deleteDoc,onSnapshot,query,where,orderBy,limit,writeBatch} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
import {firebaseConfig} from './firebase-config.js';

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=s=>document.querySelector(s),
E=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k.startsWith('on'))e.addEventListener(k.slice(2),a[k]);else if(k==='v')e.value=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&x!==false&&e.append(x.nodeType?x:document.createTextNode(x)));return e},
eur=c=>(c<0?'−':'')+(Math.abs(c)/100).toFixed(2).replace('.',',')+' €',
par=s=>Math.round(parseFloat(String(s).replace(',','.'))*100)||0,
dt=t=>new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'}),
dtFull=t=>{const d=new Date(t);return isNaN(d)?'':d.toLocaleString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})},
RN={prop:'Proprietario',resp:'Responsabile',dip:'Dipendente'},
PM={fondo:['prop','resp'],chiudi:['prop','resp'],catalogo:['prop','resp'],storico:['prop','resp'],utenti:['prop'],clienti:['prop','resp','dip']};

let S={users:[],cats:[],prods:[],ses:[],sales:[],mov:[],audit:[],clienti:[],bet_mov:[],bet_ses:[]},me=null,tab='v',cat=null,cart={},pin='',idle,msg='',F={s:'',o:'',t:'',p:'',d:'',hideBetClients:false,sBet:'',sBetRaw:''};
let isTestMode=false;
let activeModule=null;
let renderScheduled=false;

function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{
    renderScheduled = false;
    render();
  });
}

const can=a=>me&&PM[a].includes(me.ruolo);
const isDavide=()=>me&&(me.nome.trim().toLowerCase()==='davide'||me.ruolo==='prop');
const isBetUser=()=>me&&['michele','danilo','attilio','davide'].some(n=>me.nome.trim().toLowerCase()===n);
const pw=p=>p+'-Bar#26';

const getCOL=()=>({
  users:'profili',
  cats:'cats',
  prods:'prods',
  ses: isTestMode ? 'test_ses' : 'ses',
  sales: isTestMode ? 'test_sales' : 'sales',
  mov: isTestMode ? 'test_mov' : 'mov',
  audit: isTestMode ? 'test_audit' : 'audit',
  clienti: isTestMode ? 'test_clienti' : 'clienti',
  bet_mov: isTestMode ? 'test_bet_mov' : 'bet_mov',
  bet_ses: isTestMode ? 'test_bet_ses' : 'bet_ses'
});
const cmp=(a,b)=>(String(a.id)>String(b.id))-(String(a.id)<String(b.id));

let unsub=[],unsubSM=[],curId=null,part={sales:{cur:[],hist:[]},mov:{cur:[],hist:[]}},LD=new Set(),sel=null,needSetup=false,busy=false;
const err=e=>{
  console.error("Errore Firebase:", e);
  msg='⚠️ Errore Cloud: '+(e.code||e.message);
  scheduleRender();
};

function saveDoc(colName, d){
  const C = getCOL();
  const cName = C[colName] || colName;
  const idStr = String(d.id);
  // Usa { merge: true } per evitare che update o scritture sovrascrivano interamente i documenti
  return setDoc(doc(db, cName, idStr), JSON.parse(JSON.stringify(d)), { merge: true }).catch(err);
}

function removeDoc(colName, id){
  const C = getCOL();
  const cName = C[colName] || colName;
  return deleteDoc(doc(db, cName, String(id))).catch(err);
}

function merge(){for(const k of['sales','mov']){S[k]=[...part[k].hist,...part[k].cur].sort(cmp)}}

function subSM(id){
  unsubSM.forEach(f=>f());
  unsubSM=[];
  if(!id)return;
  const C = getCOL();
  for(const k of['sales','mov']) unsubSM.push(onSnapshot(query(collection(db, C[k]), where('s','==',id)), sn=>{
    part[k].cur=sn.docs.map(d=>d.data());
    merge();
    scheduleRender();
  }, err));
}

async function loadSes(id){
  if(!id||LD.has(id)||id===curId||!me)return;
  LD.add(id);
  try{
    const C = getCOL();
    const q=k=>getDocs(query(collection(db, C[k]), where('s','==',id))), [a,b]=await Promise.all([q('sales'),q('mov')]);
    part.sales.hist.push(...a.docs.map(d=>d.data()));
    part.mov.hist.push(...b.docs.map(d=>d.data()));
    merge();
    scheduleRender();
  }catch(e){LD.delete(id);err(e);}
}

function start(){
  stop();
  const C = getCOL();
  const L=(k,q,f)=>unsub.push(onSnapshot(q,sn=>{
    S[k]=sn.docs.map(d=>d.data()).sort(cmp);
    f&&f();
    scheduleRender();
  },err));

  L('cats',collection(db, C.cats));
  L('prods',collection(db, C.prods));
  L('clienti',collection(db, C.clienti));
  // Sincronizzazione completa dei movimenti per evitare azzeramento saldi oltre 100 operazioni
  L('bet_mov',collection(db, C.bet_mov));
  L('bet_ses',collection(db, C.bet_ses));
  L('ses',collection(db, C.ses),()=>{
    const c=cur()?.id||null;
    if(c!==curId){
      if(curId){
        part.sales.hist.push(...part.sales.cur);
        part.mov.hist.push(...part.mov.cur);
        LD.add(curId);
      }
      part.sales.cur=[];
      part.mov.cur=[];
      curId=c;
      subSM(c);
      merge();
    }
  });
  if(can('storico')) L('audit',query(collection(db, C.audit),orderBy('t','desc'),limit(150)));
}

function stop(){
  unsub.forEach(f=>f());
  unsubSM.forEach(f=>f());
  unsub=[];
  unsubSM=[];
  for(const k of['cats','prods','ses','sales','mov','audit','clienti','bet_mov','bet_ses'])S[k]=[];
  part={sales:{cur:[],hist:[]},mov:{cur:[],hist:[]}};
  LD=new Set();
  curId=null;
}
function toggleTestMode(){
  isTestMode = !isTestMode;
  cart = {};
  stop();
  start();
  toast(isTestMode ? '🧪 Passato ad AMBIENTE TEST' : '✅ Tornato a DATI REALI');
}

let LI=0;const nid=()=>LI=Math.max(LI+1,Date.now()*100+Math.floor(Math.random()*100));
const tn=id=>'#'+(S.ses.findIndex(x=>String(x.id)===String(id))+1);
const tnBet=id=>'#'+((S.bet_ses||[]).findIndex(x=>String(x.id)===String(id))+1);
const vn=id=>{const a=S.sales.find(x=>String(x.id)===String(id));return'#'+S.sales.filter(x=>String(x.s)===String(a?.s)&&x.id<=id).length};
const log=(az,ent,det)=>{
  const aObj = {id:nid('a'),u:me?.id,n:me?.nome||'sistema',az,ent,det,t:Date.now()};
  saveDoc('audit', aObj);
};

const LIST=`Bevande|Campari Soda:150,Cedrata San Pellegrino:150,Cocktail San Pellegrino:150,Kinley Lemon Taste:150,Yoga succo ACE:150,Yoga succo pera:150,Yoga succo albicocca:150,Yoga succo ananas:150,Estathé limone:200,Estathé pesca:200,Coca-Cola normale:150,Coca-Cola Zero:150,Coca-Cola Zero Zero:150,Red Bull:200,Peroni:150,Corona:250,Heineken:200,Bjorne Beer (la birra dell’orso):300,Tennent’s:300,Peroni Chill Lemon:150,Tuborg:150
Snack|Lupini:100,Ceci tostati:100,Misto salato:100,Olive piccanti:100,Olive:100,Arachidi salate:100,Fave tostate:100,Lupini piccanti:100
Patatine|Pringles:200,Sticki 70 g:150,Virtual 50 g:150,Wackos Burger 40 g:150,Più Gusto Lime 70 g:150,Classica 80 g:150,Rodeo 120 g:250,Dixi Jalapeño 105 g:250,Dixi 50 g:150,Rustica 70 g:150,Grill 70 g:150,Più Gusto Vivace 70 g:150,Cross 50 g:150,Più Gusto Tartufo 70 g:150,Più Gusto Porchetta 70 g:150,Highlander Barbecue 70 g:150,Highlander Pomodoro 70 g:150,Wackos Cheeee 70 g:150,Wackos Ketchup 40 g:150
Dolci|Oreo:100,Mordicchio:150,Snickers:150,Mars:150,Twix:150,Kit Kat:150,M&M’s:150,Kinder Bueno:150,Mikado:180,Kinder Pinguì cocco:100,Kinder Pinguì caramello:100,Kinder Pinguì:100,Kinder Fetta al Latte:100,Kinder Paradiso:100,Kinder Délice:100
Cucina|Toast farcito:250,Toast con Nutella:200,Panino farcito:500,Panino con Nutella:300,Piadina farcita:400,Piadina con Nutella:300,Hot dog:300
Liquori e distillati|Grappa:300,Rum Don Papa:500,Amaretto di Saronno:300,Vecchia Romagna:300,Borghetti:250,G&B:250,Stravecchio:250,Jack Daniel’s:400,Limoncello:250,Baileys:300,Fernet-Branca:300,Brancamenta:300,Martini bianco/rosso:300,Montenegro:250,Unicum:250,Averna:250,Lucano:250,Jägermeister:250,Aperol Spritz:500,Gin Lemon:600,Gin Tonic:600`;

function lock(){
  cart={};
  pin='';
  sel=null;
  activeModule=null;
  if(isTestMode){
    isTestMode = false;
    stop();
  }
  signOut(auth);
}

async function authFlow(u){
  if(busy)return;
  if(!u){stop();me=null;activeModule=null;return scheduleRender()}
  for(let i=0;i<50&&!S.users.some(x=>String(x.id)===String(u.uid));i++)await new Promise(r=>setTimeout(r,100));
  me=S.users.find(x=>String(x.id)===String(u.uid));if(!me||!me.att){await signOut(auth);msg='Utente non abilitato';return}
  
  if(!isBetUser()){
    activeModule='bar';
    tab='v';
  } else {
    activeModule=null;
  }
  start();
  log('Accesso','utente',me.nome);
  scheduleRender();
}

async function boot(){
  scheduleRender();
  onSnapshot(collection(db,'profili'),sn=>{S.users=sn.docs.map(d=>d.data()).sort(cmp);scheduleRender()},err);
  try{needSetup=!(await getDoc(doc(db,'config','init'))).exists()}catch(e){}
  onAuthStateChanged(auth,authFlow);
  
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible' && me){
      start();
    }
  });
}

async function setup(nome,p){
  busy=true;
  try{
    const email='titolare'+Math.floor(Math.random()*9e4+1e4)+'@bar.app',c=await createUserWithEmailAndPassword(auth,email,pw(p)),pr={id:c.user.uid,nome,ruolo:'prop',att:1,email},b=writeBatch(db);
    b.set(doc(db,'profili',pr.id),pr);b.set(doc(db,'config','init'),{t:Date.now()});await b.commit();
    const b2=writeBatch(db);LIST.split('\n').forEach(l=>{const[n,ps]=l.split('|'),cid=nid();b2.set(doc(db,'cats',String(cid)),{id:cid,nome:n,att:1});ps.split(/,(?=[^,]*:\d+(?:,|$))/).forEach(x=>{const i=x.lastIndexOf(':'),pid=nid();b2.set(doc(db,'prods',String(pid)),{id:pid,c:cid,nome:x.slice(0,i),p:+x.slice(i+1),att:1})})});await b2.commit();needSetup=false
  }catch(e){msg='Errore: '+(e.code||e.message);busy=false;return scheduleRender()}
  busy=false;authFlow(auth.currentUser);
}

async function newUser(nome,ruolo,p){
  if(!nome||!/^\d{4,6}$/.test(p)){alert('Nome e PIN 4–6 cifre');return false}
  try{
    const a2=getAuth(initializeApp(firebaseConfig,'s'+Date.now())),email=nome.toLowerCase().replace(/[^a-z0-9]/g,'')+Math.floor(Math.random()*9e4+1e4)+'@bar.app',c=await createUserWithEmailAndPassword(a2,email,pw(p));
    await signOut(a2);
    const uObj = {id:c.user.uid,nome,ruolo,att:1,email};
    saveDoc('users', uObj);
    log('Nuovo utente','utente',`${nome} (${RN[ruolo]})`);
    scheduleRender();
  }catch(e){alert('Errore: '+(e.code||e.message));return false}
}

function cambioPin(){
  form('Cambia il tuo PIN',[{l:'Nuovo PIN (4–6 cifre)',k:'p',m:'numeric'}],async v=>{
    if(!/^\d{4,6}$/.test(v.p)){alert('PIN di 4–6 cifre');return false}
    try{await updatePassword(auth.currentUser,pw(v.p));log('Cambio PIN','utente',me.nome);toast('PIN aggiornato')}catch(e){alert('Esci e rientra, poi riprova ('+(e.code||e.message)+')');return false}
  })
}

const cur=()=>S.ses.find(s=>!s.ch);
const curBet=()=>(S.bet_ses||[]).find(s=>!s.ch);

function vendita(m,s){
 if(!s){m.append(E('div',{class:'cd'},E('b',{},'Nessun turno aperto'),E('p',{class:'mu'},'Solo Proprietario o Responsabile possono aprire il turno.'),can('fondo')&&E('button',{class:'b',onclick:apri},'Apri turno e imposta fondo cassa')));return}
 const cs=S.cats.filter(c=>c.att).sort((a,b)=>a.nome.localeCompare(b.nome,'it',{sensitivity:'base'}));cat=cs.find(c=>String(c.id)===String(cat))?cat:cs[0]?.id;
 m.append(E('div',{class:'cats'},cs.map(c=>E('button',{class:String(c.id)===String(cat)?'on':'',onclick:()=>{cat=c.id;scheduleRender()}},c.nome))),E('div',{class:'gr'},S.prods.filter(p=>String(p.c)===String(cat)&&p.att).sort((a,b)=>a.nome.localeCompare(b.nome,'it',{sensitivity:'base'})).map(p=>E('button',{onclick:()=>{cart[p.id]=(cart[p.id]||0)+1;scheduleRender()}},p.nome,E('small',{},eur(p.p))))));
 const ids=Object.keys(cart),T=ids.reduce((a,i)=>a+cart[i]*S.prods.find(p=>String(p.id)==String(i)).p,0);
 const cd=E('div',{class:'cd',style:'margin-top:14px'},E('b',{},'Conto'),ids.length?'':E('div',{class:'mu'},'Tocca i prodotti per aggiungerli'));
 ids.forEach(i=>{const p=S.prods.find(x=>String(x.id)==String(i));cd.append(E('div',{class:'row'},E('span',{},p.nome),E('span',{},E('button',{class:'b g s',onclick:()=>{cart[i]--;if(!cart[i])delete cart[i];scheduleRender()}},'−'),' '+cart[i]+' ',E('button',{class:'b g s',onclick:()=>{cart[i]++;scheduleRender()}},'+'),' '+eur(cart[i]*p.p))))});
 if(ids.length){const r=E('input',{inputmode:'decimal',placeholder:'Contanti ricevuti (facoltativo)'}),rs=E('div',{class:'mu'},'Resto: –');r.oninput=()=>{const c=par(r.value);rs.textContent=r.value?(c>=T?'Resto: '+eur(c-T):'Mancano '+eur(T-c)):'Resto: –'};
  cd.append(E('div',{class:'row'},E('b',{},'TOTALE'),E('b',{},eur(T))),r,rs,E('div',{class:'ac'},
    E('button',{class:'b g',onclick:()=>{cart={};scheduleRender()}},'Svuota'),
    E('button',{class:'b g',onclick:()=>{
      const sortedClients = [...S.clienti.filter(x => x.tipo !== 'bet')].sort((a,b)=>a.nome.localeCompare(b.nome, 'it', {sensitivity: 'base'}));
      const opts = [['NEW', 'CREA NUOVO CLIENTE...'], ...sortedClients.map(x=>[x.id, x.nome])];
      form('Segna a Sospeso', [
        {l:'Seleziona Cliente', k:'c', o: opts},
        {l:'Nome nuovo cliente (se stai creando un nuovo cliente)', k:'new_name'},
        {l:'Telefono nuovo cliente (opzionale)', k:'new_tel'},
        {l:'Note / Motivazione', k:'m'}
      ], v => {
        let cli = null;
        if (v.c === 'NEW' || (!v.c && v.new_name)) {
          if (!v.new_name) { alert('Inserisci il nome del nuovo cliente.'); return false; }
          cli = { id: nid('cli'), nome: v.new_name, tel: v.new_tel || '', sospeso: 0, storico: [], tipo: 'bar' };
          log('Nuovo cliente', 'cliente', v.new_name);
        } else if (v.c) {
          cli = S.clienti.find(x => String(x.id) === String(v.c));

        cli.sospeso = (cli.sospeso || 0) + T;
        cli.storico = cli.storico || [];
        const items = ids.map(i => { const p = S.prods.find(x => String(x.id) == String(i)); return { pid: p.id, n: p.nome, p: p.p, q: cart[i] }; });
        const n = nid('s');
        const sObj = { id: n, s: s.id, op: me.id, opn: me.nome, t: Date.now(), tot: T, items, cash: null, sospesoCliente: cli.nome };
        saveDoc('sales', sObj);
        
        cli.storico.push({
          id: nid('st'),
          t: Date.now(),

async function modificaMovimentoCliente(c, st) {

 form(`Modifica Movimento - ${c.nome}`, [

  if (st.sId) await loadSes(st.sId);
  const newImp = par(v.i);
  if (newImp <= 0) { alert('Inserisci un importo valido'); return false; }

  const oldImp = st.imp;
  const diff = newImp - oldImp;
  const isDebito = st.tipo === 'debito_manuale' || st.tipo === 'sospeso_cassa';

  if (isDebito) {
   c.sospeso = (c.sospeso || 0) + diff;
  } else {
   c.sospeso = (c.sospeso || 0) - diff;
  }

  if (st.tipo === 'incasso_saldo') {
   const linkedMov = S.mov.find(m => (st.movId && String(m.id) === String(st.movId)) || (m.isIncassoDebito && Math.abs(m.t - st.t) < 5000));
   if (linkedMov) {

    linkedMov.motivo = `Incasso saldo/pagamento: ${c.nome}${v.m ? ' – ' + v.m.trim() : ''}`;
    saveDoc('mov', linkedMov);

  if (st.tipo === 'sospeso_cassa') {
   const linkedSale = S.sales.find(sa => String(sa.id) === String(st.id) || Math.abs(sa.t - st.t) < 5000);
   if (linkedSale) {
    linkedSale.tot = newImp;
    saveDoc('sales', linkedSale);
   }
  }

  st.imp = newImp;
  st.nota = v.m ? v.m.trim() : '';

  saveDoc('clienti', c);
  log('Modifica movimento cliente', c.nome, `${st.tipo}: da ${eur(oldImp)} a ${eur(newImp)}`);
  toast('Movimento aggiornato nel cliente e nel turno');
 });
}

function totBet(s){
  if (!s) return { deb:0, acc:0, inc:0, pag:0, cassaIn:0, teo:0 };
  
  const allMovs = [...(S.bet_mov || [])].sort((a,b) => a.t - b.t);
  const clientBal = {};
  let deb = 0, acc = 0, inc = 0, cassaIn = 0, pag = 0;
  
  allMovs.forEach(m => {
    const cli = (m.cliente || '').trim().toLowerCase();
    const t = m.tipo;
    const imp = m.imp;
    const danilo = m.daniloNoCassa;
    const isThisShift = (String(m.s) === String(s.id));
    const pagatoBanco = m.pagatoContantiBanco;
    const isRicarica = (m.causale || '').toLowerCase().includes('ricarica');
    
    if (isThisShift) {
      if (t === 'debito') deb += imp;
      else if (t === 'accredito') acc += imp;
      else if (t === 'incasso_debito') inc += imp;
    }

    // Se l'operazione è contrassegnata come diretta al banco/cassetto (saldo cliente invariato)
    if (pagatoBanco) {
      if (isThisShift && !danilo) {
        if (t === 'paga' || t === 'uscita') {
          pag += imp; // Scala dal cassetto contanti
        } else {
          cassaIn += imp; // Entra nel cassetto contanti
        }
      }
      return; // Ritorna subito lasciando invariato il saldo del cliente
    }

    if (!cli || cli === 'cassa') {
      if (isThisShift) {
        if (t === 'entrata' || t === 'incasso_debito') {
          if (!danilo) cassaIn += imp;
        } else if (t === 'uscita' || t === 'paga') {
          if (!danilo) pag += imp;
        }
      }
      return;
    }

    const curBal = clientBal[cli] || 0;

    if (t === 'debito') {
      clientBal[cli] = curBal + imp;
    } else if (t === 'accredito') {
      clientBal[cli] = curBal - imp;
      if (isThisShift && !danilo && isRicarica) {
        cassaIn += imp;
      }
    } else if (t === 'incasso_debito') {
      let cashEntered = 0;
      if (curBal > 0) {
        cashEntered = imp;
        clientBal[cli] = curBal - imp;
      } else {
        const creditAvail = Math.abs(curBal);
        const creditUsed = Math.min(creditAvail, imp);
        cashEntered = imp - creditUsed;
        clientBal[cli] = curBal + imp;
      }
      if (isThisShift && !danilo && cashEntered > 0) {
        cassaIn += cashEntered;
      }
    } else if (t === 'paga') {
      clientBal[cli] = curBal + imp;
      if (isThisShift && !danilo) {
        pag += imp;
      }
    } else if (t === 'entrata' && isThisShift && !danilo) {
      cassaIn += imp;
    } else if (t === 'uscita' && isThisShift && !danilo) {
      pag += imp;
    }
  });

  return { 
    deb, 
    acc, 
    inc, 
    pag, 
    cassaIn, 
    teo: s.fondo + cassaIn - pag 
  };
}

function getBetStatsShift(s){
  if(!s) return { 
    totDebiti: 0, debitiGiocate: 0, debitiRicariche: 0, debitiAltro: 0,
    totAccrediti: 0, accreditiVincite: 0, accreditiPrelievi: 0, 
    totRicariche: 0, totScommesseNetto: 0, scommesseGiocate: 0, scommesseVinte: 0, totPaga: 0,
    entrateManuali: 0, incassiDebiti: 0, usciteManuali: 0, vincitePagate: 0,
    debitiDanilo: 0, incassiDanilo: 0
  };
  
  const movs = (S.bet_mov || []).filter(x => String(x.s) === String(s.id));
  let totDebiti = 0, debitiGiocate = 0, debitiRicariche = 0, debitiAltro = 0;
  let totAccrediti = 0, accreditiVincite = 0, accreditiPrelievi = 0;
  let totRicariche = 0, scommesseGiocate = 0, scommesseVinte = 0, totPaga = 0;
  let entrateManuali = 0, incassiDebiti = 0, usciteManuali = 0, vincitePagate = 0;
  let debitiDanilo = 0, incassiDanilo = 0;
  
  movs.forEach(m => {
    const c = (m.causale || '').toLowerCase();
    const isRicarica = c.includes('ricarica');
    const isBiglietto = c.includes('biglietto') || c.includes('giocata') || c.includes('scommessa');
    const isPrelievo = c.includes('prelievo') || c.includes('conto');

    if (isRicarica) totRicariche += m.imp;
    if (isBiglietto) scommesseGiocate += m.imp;

    if (m.daniloNoCassa) {
      if (m.tipo === 'debito') debitiDanilo += m.imp;
      else if (m.tipo === 'incasso_debito' || m.tipo === 'accredito' || m.tipo === 'paga') incassiDanilo += m.imp;
    }

    if (m.tipo === 'debito') {
      totDebiti += m.imp;
      if (isRicarica) {
        debitiRicariche += m.imp;
      } else if (isBiglietto) {
        debitiGiocate += m.imp;
      } else {
        debitiAltro += m.imp;
      }
    } else if (m.tipo === 'accredito') {
      totAccrediti += m.imp;
      if (isPrelievo) {
        accreditiPrelievi += m.imp;
      } else if (isRicarica) {
        if (!m.daniloNoCassa) {
          incassiDebiti += m.imp;
        }
      } else {
        accreditiVincite += m.imp;
        scommesseVinte += m.imp;
      }
    } else if (m.tipo === 'paga') {
      totAccrediti += m.imp;
      accreditiVincite += m.imp;
      scommesseVinte += m.imp;
      if (!m.daniloNoCassa) {
        totPaga += m.imp;
        vincitePagate += m.imp;
      }
    } else if (m.tipo === 'entrata') {
      if (!m.daniloNoCassa) {
        entrateManuali += m.imp;
      }
    } else if (m.tipo === 'uscita') {
      if (!m.daniloNoCassa) {
        usciteManuali += m.imp;
      }
    } else if (m.tipo === 'incasso_debito') {
      if (!m.daniloNoCassa) {
        incassiDebiti += m.imp;
      }
    }

    if (m.pagatoContantiBanco && !m.daniloNoCassa && m.tipo !== 'entrata' && m.tipo !== 'incasso_debito' && m.tipo !== 'uscita' && m.tipo !== 'paga') {
      incassiDebiti += m.imp;
    }
  });

  const totScommesseNetto = scommesseGiocate - scommesseVinte;

  return { 
    totDebiti, 
    debitiGiocate, 
    debitiRicariche,
    debitiAltro,
    totAccrediti, 
    accreditiVincite, 
    accreditiPrelievi, 
    totRicariche,
    totScommesseNetto,
    scommesseGiocate,
    scommesseVinte,
    totPaga,
    entrateManuali,
    incassiDebiti,
    usciteManuali,
    vincitePagate,
    debitiDanilo,
    incassiDanilo
  };
}

function getBetClientStats(clientName){
  const activeShift = curBet();
  const movs = (S.bet_mov || [])
    .filter(x => x.cliente && x.cliente.trim().toLowerCase() === clientName.trim().toLowerCase());

  let deb = 0, inc = 0, acc = 0, pag = 0, currAcc = 0;

  movs.forEach(m => {
    const imp = m.imp || 0;
    if (m.pagatoContantiBanco) {
      return;
    }
    if (m.tipo === 'debito') {
      deb += imp;
    } else if (m.tipo === 'incasso_debito') {
      inc += imp;
    } else if (m.tipo === 'accredito') {
      acc += imp;
      if (activeShift && String(m.s) === String(activeShift.id)) {
        currAcc += imp;
      }
    } else if (m.tipo === 'paga') {
      pag += imp;
    }
  });

  // CORREZIONE: 'pag' (soldi dati in contanti al cliente) riduce il credito accumulato
  const saldoNetto = (deb + pag) - (acc + inc);
  const debitoResiduo = Math.max(0, saldoNetto);
  
  return { saldoNetto, debitoResiduo, totAccrediti: currAcc };
}

  r.oninput = () => {

    fl('Contante réellement contato (€)', r),

    fl('Nota', n)
  ), [
    ['Annulla', null, 'g'],
    ['Chiudi e azzera turno', () => {
      if (!r.value) { alert('Inserisci il contante contato'); return false; }
      const re = par(r.value);
      Object.assign(s, { ch: Date.now(), chn: me.nome, chiusa: me.id, reale: re, teo: t.teo, diff: re - t.teo, nota: n.value.trim() });
      saveDoc('bet_ses', s);
      log('Chiusura turno', 'turno ' + tnBet(s.id), `Teorico ${eur(t.teo)}, contato ${eur(re)}, diff ${eur(re - t.teo)}`);
      toast('Turno chiuso. Differenza: ' + eur(s.diff));
    }, 'r']
  ]);

function opsScommesse(shiftId = null){
  let list = [...(S.bet_mov || [])];
  if (shiftId) {
    list = list.filter(x => String(x.s) === String(shiftId));
  }
  list.sort((a,b) => b.t - a.t);
  const container = E('div', {});
  if (!list.length) {
    container.append(E('div', {class:'cd mu'}, 'Nessun movimento registrato.'));
    return container;
  }
  list.forEach(x => {
    const isDeb = x.tipo === 'debito', isAcc = x.tipo === 'accredito', isPaga = x.tipo === 'paga', isEnt = x.tipo === 'entrata', isUsc = x.tipo === 'uscita';
    const label = isDeb ? 'DEBITO' : isAcc ? 'ACCREDITO' : isPaga ? 'PAGAMENTO VINCITA (− CASSA)' : isEnt ? 'ENTRATA MANUALE CASSA (+ CASSA)' : isUsc ? 'USCITA MANUALE CASSA (− CASSA)' : 'INCASSO DEBITO (+ CASSA)';
    const badgeClass = (isDeb || isPaga || isUsc) ? 'neg' : 'pos';
    const sign = (isPaga || isUsc) ? '− ' : (isDeb ? '' : '+ ');

    const tagDaniloText = x.tipo === 'debito' ? '👤 DEBITO STORNATO DA DANILO (NON IN CASSA)' :
                          x.tipo === 'accredito' ? '👤 ACCREDITATO DA DANILO (NON IN CASSA)' :
                          x.tipo === 'paga' ? '👤 PAGATO DA DANILO (NON IN CASSA)' :
                          '👤 INCASSATO DA DANILO (NON IN CASSA)';

    container.append(E('div', {class:'cd'},
      E('div', {class:'row', style:'border:0'},
        E('b', {}, `${label}${x.cliente ? ' · ' + x.cliente : ''}`),
        E('b', {class: badgeClass}, sign + eur(x.imp))
      ),
      E('div', {class:'sm mu'}, `🗓️ ${dtFull(x.t)} · Op: ${x.opn || '–'} · Turno: ${x.sNum || '#1'}`),
      E('div', {class:'sm'}, `Causale: ${x.causale || '–'}`),
      x.daniloNoCassa ? E('div', {class:'tag-danilo', style:'margin-top:4px'}, tagDaniloText) : null,
      x.pagatoContantiBanco ? E('div', {class:'tag-danilo', style:'margin-top:4px;background:#2b7a4b'}, '💵 PAGATO SUBITO IN CONTANTI AL BANCO (+ CASSA, SALDO CLIENTE 0 €)') : null,
      E('div', {class:'f', style:'margin-top:6px'},
        E('button', {class:'b g s', onclick: () => modificaMovimentoBetModal(x)}, '✏️ Modifica'),
        E('button', {class:'b r s', onclick: () => eliminaMovimentoBet(x)}, '🗑️ Storna / Elimina')
      )
    ));
  });
  return container;
}

function apriModalScommessa(tipoOp, preselectedClientId=null) {
  const activeShift = curBet();
  if(!activeShift){
    alert('Impossibile registrare: nessun turno aperto! Apri prima il turno.');
    return false;
  }

  const betClients = S.clienti.filter(x => x.tipo === 'bet');
  const sortedClients = [...betClients].sort((a,b)=>a.nome.localeCompare(b.nome, 'it', {sensitivity: 'base'}));
  const optsClients = [['NEW', 'CREA NUOVO CLIENTE...'], ...sortedClients.map(x=>[x.id, x.nome])];
  
  const causaliPreset = tipoOp === 'debito' ? [
    ['Biglietto', 'Biglietto'],
    ['Ricarica Conto Gioco', 'Ricarica Conto Gioco'],
    ['MANUALE', 'Altra causale manuale...']
  ] : [
    ['Vincita Scommessa', 'Vincita Scommessa'],
    ['Ricarica Conto Gioco', 'Ricarica Conto Gioco'],
    ['Prelievo conto gioco', 'Prelievo conto gioco'],
    ['MANUALE', 'Altra causale manuale...']
  ];

  const titolo = tipoOp === 'debito' ? 'Segna al Cliente' : 
                 tipoOp === 'accredito' ? 'Accredito / Ricarica Conto Gioco' : 
                 tipoOp === 'paga' ? 'Paga il Cliente' : 'Incassa Debito Scommessa';

  const selectClient = E('select', {}, optsClients.map(([v,n]) => E('option',{value:v,...(preselectedClientId && String(preselectedClientId)===String(v)?{selected:''}:{})},n)));
  const inputNewClient = E('input', {placeholder:'Nome nuovo cliente (se stai creando)'});
  const inputImp = E('input', {type:'text', inputmode:'decimal', placeholder:'0,00'});
  const selectCausale = (tipoOp !== 'incasso') ? E('select', {}, causaliPreset.map(([v,n])=>E('option',{value:v},n))) : null;
  const inputCausale = E('input', {placeholder:'Causale / Note'});
  
  const checkDanilo = E('input', {type:'checkbox', style:'width:20px;height:20px;margin-right:8px'});
  const checkPagatoBanco = E('input', {type:'checkbox', style:'width:20px;height:20px;margin-right:8px'});

  const textDanilo = tipoOp === 'accredito' ? 'Accreditato da Danilo (non incide nel cassetto contanti)' :
                     tipoOp === 'paga' ? 'Pagato da Danilo (non incide nel cassetto contanti)' :
                     'Incassato da Danilo (non incide nel cassetto contanti)';

  const labelPagatoBanco = tipoOp === 'paga'
    ? '💵 PAGA DAL CASSETTO (CLIENTE RIMANE INVARIATO)'
    : '💵 PAGATO SUBITO IN CONTANTI AL BANCO (entra in cassa, saldo cliente invariato)';

  // Regole di visibilità opzioni extra:
  // 1. In 'debito' (Segna al cliente) vengono rimossi sia Danilo che Pagato Subito
  // 2. In 'incasso' viene rimosso Pagato Subito (resta Danilo)
  const showDanilo = (tipoOp !== 'debito');
  const showPagatoBanco = (tipoOp !== 'debito' && tipoOp !== 'incasso');

  const bodyModal = E('div', {},
    fl('Seleziona Cliente Scommesse', selectClient),
    fl('Nuovo Cliente (se selezionato CREA NUOVO)', inputNewClient),
    fl('Importo (€)', inputImp),
    (tipoOp !== 'incasso') ? fl('Causale Predefinita', selectCausale) : null,
    fl('Causale / Dettaglio Note', inputCausale),
    showDanilo ? E('div', {style:'margin-top:12px;display:flex;align-items:center'},
      checkDanilo,
      E('label', {style:'font-weight:bold;font-size:14px;color:var(--fg)'}, textDanilo)
    ) : null,
    showPagatoBanco ? E('div', {style:'margin-top:8px;display:flex;align-items:center'},
      checkPagatoBanco,
      E('label', {style:'font-weight:bold;font-size:14px;color:var(--ok)'}, labelPagatoBanco)
    ) : null
  );

  modal(titolo, bodyModal, [
    ['Annulla', null, 'g'],
    ['Conferma Operazione', () => {
      let cliName = '';
      if (selectClient.value === 'NEW' || (!selectClient.value && inputNewClient.value.trim())) {
        if (!inputNewClient.value.trim()) { alert('Inserisci il nome del nuovo cliente.'); return false; }
        cliName = inputNewClient.value.trim();
        const newC = { id: nid('cli'), nome: cliName, tel: '', sospeso: 0, storico: [], tipo: 'bet' };
        saveDoc('clienti', newC);
      } else {
        const found = betClients.find(x => String(x.id) === String(selectClient.value));
        if (!found) { alert('Seleziona un cliente.'); return false; }
        cliName = found.nome;
      }

      const imp = par(inputImp.value);
      if (imp <= 0) { alert('Inserisci un importo valido.'); return false; }

      let causaleFinale = inputCausale.value.trim();
      if (tipoOp !== 'incasso') {
        if (selectCausale && selectCausale.value !== 'MANUALE') {
          causaleFinale = selectCausale.value + (causaleFinale ? ' – ' + causaleFinale : '');
        }
      } else {
        causaleFinale = causaleFinale || 'Incasso saldo debito scommesse';
      }

      if (!causaleFinale || !causaleFinale.trim()) {
        alert('errore, inserire la nota');
        return false;
      }

      const mObj = {
        id: nid('bm'),
        s: activeShift.id,
        sNum: tnBet(activeShift.id),
        t: Date.now(),
        op: me.id,
        opn: me.nome,
        cliente: cliName,
        tipo: tipoOp === 'incasso' ? 'incasso_debito' : tipoOp,
        imp: imp,
        causale: causaleFinale,
        daniloNoCassa: showDanilo ? checkDanilo.checked : false,
        pagatoContantiBanco: showPagatoBanco ? checkPagatoBanco.checked : false
      };

      saveDoc('bet_mov', mObj);
      log('Scommessa ' + tipoOp, cliName, `${eur(imp)} – ${causaleFinale}`);
      toast('Operazione scommesse registrata');
    }]
  ]);
}

 if(!L.length)w.append(E('div',{class:'mu'},'Nessuna operazione.'));

function chiudi(){const s=cur(),t=tot(s),r=E('input',{inputmode:'decimal',placeholder:'0,00'}),n=E('input',{placeholder:'Nota (facoltativa)'}),d=E('b',{});r.oninput=()=>{const x=par(r.value)-t.teo;d.className=x<0?'neg':x>0?'pos':'';d.textContent='Differenza: '+eur(x)};d.textContent='Differenza: –';
 modal('Chiusura cassa',E('div',{},E('div',{class:'row'},'Contante teorico',E('b',{},eur(t.teo))),fl('Contante réellement contato (€)',r),E('div',{style:'margin:8px 0'},d),fl('Nota',n)),[['Annulla',null,'g'],['Chiudi e azzera',()=>{if(!r.value){alert('Inserisci il contante contato');return false}const re=par(r.value);Object.assign(s,{ch:Date.now(),chn:me.nome,chiusa:me.id,reale:re,teo:t.teo,diff:re-t.teo,nota:n.value.trim()});saveDoc('ses', s);log('Chiusura turno','turno '+tn(s.id),`Teorico ${eur(t.teo)}, contato ${eur(re)}, differenza ${eur(re-t.teo)}`);toast('Turno chiuso. Differenza: '+eur(s.diff))},'r']])}
function csv(rows){return'\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\n')}

async function dl(name,data){try{const d=await window.claude?.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){if(e?.code==='declined')return}modal('Esporta CSV (copia il testo)',E('textarea',{rows:10},data),[['Chiudi',null,'g']])}

async function deleteSes(shiftId){
 if(!confirm(`Sei sicuro di voler eliminare il Turno #${tn(shiftId)} e tutte le sue operazioni?`)) return;
 removeDoc('ses', shiftId);

 const salesToDelete = S.sales.filter(x => String(x.s) === String(shiftId));
 const movToDelete = S.mov.filter(x => String(x.s) === String(shiftId));
 salesToDelete.forEach(sa => removeDoc('sales', sa.id));
 movToDelete.forEach(mo => removeDoc('mov', mo.id));

 log('Eliminato turno', 'turno #' + tn(shiftId), `Turno ID ${shiftId}`);
 toast('Turno eliminato');
}

async function deleteAllSes(){
 if(!confirm("ATTENZIONE: Sei sicuro di voler eliminare TUTTI i turni e le relative vendite e movimenti? L'operazione non è reversibile!")) return;
 const sesIds = S.ses.map(x => x.id);
 const salesIds = S.sales.map(x => x.id);
 const movIds = S.mov.map(x => x.id);

 for(const id of sesIds) removeDoc('ses', id);
 for(const id of salesIds) removeDoc('sales', id);
 for(const id of movIds) removeDoc('mov', id);

 log('Eliminati tutti i turni', 'turni', 'Tutti i turni cancellati');
 toast('Tutti i turni sono stati eliminati');
}

async function mostraOperazioniTurno(s){
  await loadSes(s.id);
  const t = tot(s);
  const rep = E('div', {class:'cd', style:'margin-bottom:12px;background:var(--cd);border:1px solid var(--ln)'},
    E('b', {style:'display:block;margin-bottom:8px'}, `📊 Report Riepilogativo Turno Bar ${tn(s.id)}`),
    E('div', {class:'k', style:'grid-template-columns:1fr 1fr;gap:6px'},
      E('div', {}, E('small', {}, 'Fondo Iniziale'), E('b', {}, eur(s.fondo))),
      E('div', {}, E('small', {}, 'Vendite Lorde'), E('b', {}, eur(t.g))),
      E('div', {}, E('small', {}, 'Incasso Netto (Contanti + Incassi Debiti)'), E('b', {}, eur(t.net))),
      E('div', {}, E('small', {}, 'Debiti Creati (Sospesi)'), E('b', {class:'neg'}, eur(t.totDebitiCreati))),
      E('div', {}, E('small', {}, 'Debiti Saldati / Incassati'), E('b', {class:'pos'}, eur(t.incDeb))),
      E('div', {}, E('small', {}, 'Entrate Manuali'), E('b', {}, eur(t.en))),
      E('div', {}, E('small', {}, 'Uscite Manuali'), E('b', {class:'neg'}, eur(-t.us))),
      E('div', {class:'w'}, E('small', {}, 'CONTANTE TEORICO CASSA'), E('b', {style:'font-size:22px'}, eur(t.teo)))
    )
  );
  const opsContainer = E('div', {style:'max-height:60vh;overflow-y:auto;padding-right:4px'}, rep, ops(s.id, {ro:1}));
  modal(`Operazioni e Report Turno Bar ${tn(s.id)}`, opsContainer, [['Chiudi', null, 'g']]);
}

 );
 if(!F.s&&S.ses.length)F.s=S.ses[S.ses.length-1].id;const ss=F.s?[+F.s]:[];loadSes(+F.s);ss.forEach(id=>m.append(E('div',{class:'mu sm'},'Turno '+tn(id)),ops(id,{...F,ro:1})));
 const ex=[['Turno','Tipo','Id','Data','Operatore','Importo €','Motivo','Dettaglio']];S.ses.forEach(s=>{S.sales.filter(x=>String(x.s)===String(s.id)).forEach(x=>ex.push([tn(s.id),'vendita',vn(x.id),dt(x.t),x.opn,x.tot/100,'',x.items.map(i=>i.q+'x '+i.n).join(', ')]));S.mov.filter(x=>String(x.s)===String(s.id)).forEach(x=>ex.push([tn(s.id),x.tipo,vn(x.id),dt(x.t),x.opn,x.imp/100,x.motivo,(x.items||[]).map(i=>i.q+'x '+i.n).join(', ')||'rif. '+vn(x.rif)]))});
 m.append(E('button',{class:'b g',onclick:()=>dl('operazioni.csv',csv(ex))},'⬇ Esporta operazioni CSV'),' ',E('button',{class:'b g',onclick:()=>dl('turni.csv',csv([['Turno','Apertura','Aperto da','Fondo','Teorico','Contato','Differenza','Chiusura','Chiuso da','Nota'],...S.ses.map(s=>[tn(s.id),dt(s.ap),s.dan,s.fondo/100,s.teo!=null?s.teo/100:tot(s).teo/100,s.reale!=null?s.reale/100:'',s.diff!=null?s.diff/100:'',s.ch?dt(s.ch):'',s.chn||'',s.nota||''])]))},'⬇ Esporta turni CSV'));
 m.append(E('h3',{},'Registro attività'),...[...S.audit].reverse().slice(0,150).filter(a=>!F.o||String(a.u)===String(F.o)).map(a=>E('div',{class:'row sm'},E('span',{},E('b',{},a.az),' · '+a.ent+' · '+a.det),E('span',{class:'mu'},a.n+' · '+dt(a.t)))))}
